Version: 2.3


#
# Plugin PlaceHolders 
# Use these Placeholders in you Commands and Broadcasts
#

#
# NOTICE If PlaceholderAPI (PAPI) Is Instslled:
# Placeholders can be used in broadcasts or commands. BUT they will be placeholders for the Victim ONLY. you will NOT be able to use a PAPI Placeholder for an Attacker

####### Victim Placeholders
# %%Victim%% - Player that has Died
# %%Victim-X%% - Player that has died X location
# %%Victim-Y%% - Player that has died y location
# %%Victim-Z%% - Player that has died z location
# %%Victim-World%% - Player that has died World location
# %%Victim-Deaths%% - Amount of times the Player has died
# %%Victim-K/D%% - Kill/Death Ratio of Player that has died

####### Attacker Placeholders
# %%Attacker%% - Player that Killed Victim
# %%Attacker-X%% - Player that Killed Victim x Location
# %%Attacker-Y%% - Player that Killed Victim y Location
# %%Attacker-Z%% - Player that Killed Victim z Location
# %%Attacker-World%% - Player that Killed Victim World Location
# %%Attacker-Health%% - Attackers Health 
# %%Attacker-Kills%% - Amount of Kills Attacker Has
# %%Attacker-K/D%% - Kill/Death Ration of Attacker

####### Other Placeholder
# %%Prefix%% - Prefix Defined in Config.Yml

##### Example
#COD:  <-- Ignore This
#   ALL:  <-- Method Of Death
#       Total: # <--- Put the Amount of Commands/Broadcasts for this type of death.  MUST be Integer. Set as 0 for no commands or broadcasts
#       1: ''  <--- Command/Broadcast Spot. Place Commands or Broadcasts inside of apostrophe.
#       2: ''  <--- As long as this Style is followed. Any amount of Commands can be Used.
